name: Repository integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements-validation.txt -r scripts/requirements-rendering.txt
      - name: Validate structure, links, and metadata consistency
        run: python scripts/validate_repository.py
      - name: Check validator regressions
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Verify mathematical payloads and native site rendering
        run: python scripts/verify_math_rendering.py
      - name: Validate Citation File Format 1.2.0
        run: cffconvert --validate -i CITATION.cff
